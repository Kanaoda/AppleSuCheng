# 蘋果速成 / Apple SuCheng
# encoding: utf-8

schema:
  schema_id: apple_sucheng
  name: 蘋果速成
  version: "0.1.0"
  author:
    - Kanaoda
  description: |
    深度複刻 Windows 速成使用習慣的 macOS 繁體中文輸入法。

switches:
  - name: ascii_mode
    states: [ 中文, 英文 ]
    reset: 0
  - name: full_shape
    states: [ 半形, 全形 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: prediction
    reset: 1
  # 選字／關聯展開（←／→）；無 states，不跳狀態列提示
  - name: expanded_menu
    reset: 0

engine:
  processors:
    - lua_processor@*sucheng_keys
    - predictor
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - predict_translator
    - punct_translator
    - table_translator
  filters:
    - lua_filter@*sucheng_hint
    - simplifier

speller:
  delimiter: " ;"
  alphabet: abcdefghijklmnopqrstuvwxyz
  max_code_length: 2

translator:
  dictionary: apple_sucheng
  enable_completion: false
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|"
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|"

predictor:
  db: predict.db
  max_candidates: 45
  max_iterations: 1

key_binder:
  import_preset: default
  bindings:
    - { when: predicting, accept: comma, send: comma }
    - { when: predicting, accept: period, send: period }
    - { when: predicting, accept: equal, send: equal }
    - { when: predicting, accept: minus, send: minus }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: always, accept: Shift+space, toggle: full_shape }
    - { when: always, accept: Control+comma, toggle: full_shape }
    - { when: always, accept: Control+period, toggle: ascii_punct }

menu:
  page_size: 9

simplifier:
  tips: all

recognizer:
  import_preset: default

style:
  font_point: 17
