# 蘋果速成 default
# encoding: utf-8

config_version: '0.1'

schema_list:
  - schema: apple_sucheng

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 9

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    # Shift 中／英改由 sucheng_keys.lua 處理（避免 inline_ascii 把英文黏在同一組字）
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

selector:
  bindings:
    ISO_Left_Tab: previous_candidate
    Shift+Tab: previous_candidate
    Tab: next_candidate

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
